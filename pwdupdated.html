<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Serenia</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../src/output.css" />
  </head>
  <body class="bg-stone-200">
    <div>
      <img src="./assets/Logo (1).png" alt="logo" class="h-6 mx-auto mt-10" />
    </div>
    <div class="bg-white h-115 w-100 mx-auto mt-20">
      <img src="./assets/3D - All.png" alt="Password updated" class="mx-auto mb-5 pt-15" />
      <div class="text-center">
        <span class="font-medium text-[25px] text-center mb-5">Password Updated!</span>
      </div>
      <div class="text-center mt-3 mb-10 text-[14px]">
        <span class=""
          >Your password has been reset. You can now <br />
          use your new credentials to log in.</span
        >
      </div>
      <hr class="border-black/20 mb-5" />
      <button
        class="bg-[#56593B] transition-all duration-300 hover:bg-[#43462e] hover:ring-4 hover:ring-[#56593B]/30 text-white h-10 w-90 ml-5"
      >
        <a href="login.html"> Back to login</a>
      </button>
    </div>
  </body>
