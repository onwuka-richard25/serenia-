<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Tailwind Calendar</title>
    <link rel="stylesheet" href="../src/output.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-gray-100 font-sans">
    <div class="calendar-card rounded-2xl bg-white p-6 sm:p-8 shadow-md">
      <!-- Calendar Header -->
      <div class="mb-8 flex items-center justify-between">
        <button
          id="prevMonth"
          class="text-2xl text-gray-400 hover:text-gray-600 transition-colors px-2"
        >
          &lsaquo;
        </button>
        <h2 id="monthTitle" class="text-[18px] font-bold text-gray-800"></h2>
        <button
          id="nextMonth"
          class="text-2xl text-gray-400 hover:text-gray-600 transition-colors px-2"
        >
          &rsaquo;
        </button>
      </div>

      <!-- Weekday Labels -->
      <div class="mb-5 grid grid-cols-7 text-center">
        <span class="text-[11px] font-bold tracking-wider text-gray-300">MON</span>
        <span class="text-[11px] font-bold tracking-wider text-gray-300">TUE</span>
        <span class="text-[11px] font-bold tracking-wider text-gray-300">WED</span>
        <span class="text-[11px] font-bold tracking-wider text-gray-300">THU</span>
        <span class="text-[11px] font-bold tracking-wider text-gray-300">FRI</span>
        <span class="text-[11px] font-bold tracking-wider text-gray-300">SAT</span>
        <span class="text-[11px] font-bold tracking-wider text-gray-300">SUN</span>
      </div>

      <!-- Days Grid -->
      <div id="daysGrid" class="grid grid-cols-7 gap-y-3 justify-items-center"></div>
    </div>

    <script>
      let currentDate = new Date();
      let selectedDate = null;

      const monthTitle = document.getElementById("monthTitle");
      const daysGrid = document.getElementById("daysGrid");
      const prevBtn = document.getElementById("prevMonth");
      const nextBtn = document.getElementById("nextMonth");

      const monthNames = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];

      function renderCalendar() {
        daysGrid.innerHTML = "";

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        // Set month title
        monthTitle.textContent = `${monthNames[month]} ${year}`;

        // First day of current month
        const firstDay = new Date(year, month, 1);
        // Adjust start index for Monday offset (0 = Mon, 6 = Sun)
        let startingDay = firstDay.getDay() - 1;
        if (startingDay === -1) startingDay = 6;

        // Last day of current month
        const totalDays = new Date(year, month + 1, 0).getDate();

        // Days in previous month
        const prevMonthDays = new Date(year, month, 0).getDate();

        // 1. Render Previous Month Days
        for (let i = startingDay; i > 0; i--) {
          const dayDiv = document.createElement("div");
          dayDiv.className =
            "flex h-11 w-11 items-center justify-center font-semibold text-gray-300";
          dayDiv.textContent = prevMonthDays - i + 1;
          daysGrid.appendChild(dayDiv);
        }

        // 2. Render Current Month Days
        for (let day = 1; day <= totalDays; day++) {
          const dayDiv = document.createElement("div");
          const isSelected =
            selectedDate &&
            selectedDate.getDate() === day &&
            selectedDate.getMonth() === month &&
            selectedDate.getFullYear() === year;

          if (isSelected) {
            dayDiv.className =
              "flex h-11 w-11 items-center justify-center rounded-[14px] bg-[#f5a623] font-bold text-white shadow-lg shadow-[#f5a623]/40 cursor-pointer";
          } else {
            dayDiv.className =
              "flex h-11 w-11 items-center justify-center font-semibold text-gray-700 hover:bg-gray-100 rounded-xl cursor-pointer transition-colors";
          }

          dayDiv.textContent = day;
          dayDiv.addEventListener("click", () => {
            selectedDate = new Date(year, month, day);
            renderCalendar();
          });

          daysGrid.appendChild(dayDiv);
        }

        // 3. Render Next Month Days (fill grid to 42 cells)
        const totalGridCells = daysGrid.children.length;
        const remainingCells = 42 - totalGridCells;

        for (let i = 1; i <= remainingCells; i++) {
          const dayDiv = document.createElement("div");
          dayDiv.className =
            "flex h-11 w-11 items-center justify-center font-semibold text-gray-300";
          dayDiv.textContent = i;
          daysGrid.appendChild(dayDiv);
        }
      }

      prevBtn.addEventListener("click", () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
      });

      nextBtn.addEventListener("click", () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
      });

      // Initial render
      renderCalendar();
    </script>
  </body>
</html>
