<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - Serenia</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link rel="stylesheet" href="./css/serenia.css" />
    <script src="./js/gallery.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="./js/calendar.js" defer></script>
    <script src="./js/tour-modal.js" defer></script>
  </head>
  <body class="bg-ivory min-h-screen text-gray-800">
    <nav class="site-nav sticky top-0 z-50 flex min-h-20 w-full flex-wrap items-center justify-between gap-4 border-b border-gray-100 bg-white px-4 py-3 text-sm lg:flex-nowrap lg:px-16 lg:py-0">
      <div class="flex items-center gap-2 font-bold text-2xl text-gray-900">
        <a href="./home.html" aria-label="Serenia home">
          <img src="./assets/Logo (1).png" alt="logo" class="w-auto block" />
        </a>
      </div>
      <div class="hidden lg:block">
        <ul class="flex gap-8 lg:gap-12 items-center text-sm text-gray-600 font-medium">
          <li class="nav-link">
            <a href="./properties.html">Properties</a>
          </li>
          <li class="nav-link"><a href="./amenities.html">Amenities</a></li>
          <li class="nav-link text-gray-900 border-b-2 border-gray-900 pb-2">
            <a href="./gallery.html">Gallery</a>
          </li>
          <li class="nav-link"><a href="./blogs.html">Blogs</a></li>
        </ul>
      </div>
      <div class="hidden lg:block">
        <ul class="flex gap-4 lg:gap-6 items-center">
          <li class="nav-link px-4 py-3 font-medium cursor-pointer text-gray-600">
            <a href="./contactus.html">Contact us</a>
          </li>
          <li
            class="action-btn bg-stone font-medium px-5 py-3 text-gray-800 cursor-pointer rounded-md"
          >
            <a href="./contactus.html">Request tour</a>
          </li>
        </ul>
      </div>
      <details class="relative ml-auto lg:hidden">
        <summary aria-label="Open navigation menu" class="flex h-11 w-11 cursor-pointer list-none items-center justify-center rounded border border-gray-200 text-gray-800 hover:bg-stone [&::-webkit-details-marker]:hidden">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" stroke-width="1.8" /></svg>
        </summary>
        <div class="absolute right-0 top-full z-50 mt-2 w-72 max-w-[calc(100vw-2rem)] border border-gray-200 bg-white p-3 shadow-lg">
          <a href="./properties.html" class="block rounded px-3 py-2 text-gray-700 hover:bg-stone">Properties</a>
          <a href="./amenities.html" class="block rounded px-3 py-2 text-gray-700 hover:bg-stone">Amenities</a>
          <a href="./gallery.html" class="block rounded px-3 py-2 text-gray-700 hover:bg-stone" aria-current="page">Gallery</a>
          <a href="./blogs.html" class="block rounded px-3 py-2 text-gray-700 hover:bg-stone">Blogs</a>
          <a href="./contactus.html" class="block rounded px-3 py-2 text-gray-700 hover:bg-stone">Contact us</a>
          <a href="./contactus.html" class="mt-2 block rounded bg-olive px-3 py-2 text-center font-medium text-white hover:bg-olive-dark">Request tour</a>
        </div>
      </details>
    </nav>

    <main class="site-shell px-4 py-10 lg:px-8 lg:py-14">
      <section class="text-center py-8 lg:py-14 reveal">
        <p class="text-sm uppercase tracking-[0.24em] text-gray-500">Explore the life</p>
        <h1 class="hero-title mt-4 text-5xl lg:text-7xl font-medium leading-tight text-gray-900">
          A glimpse into daily elegance
        </h1>
      </section>

      <section class="gallery-slider-section mt-6" aria-label="Serenia gallery">
        <div class="mb-5 flex items-center justify-between gap-4">
          <h2 class="text-xl font-medium text-gray-900">Community gallery</h2>
          <div class="flex gap-2">
            <button class="gallery-slider-control" type="button" data-gallery-prev aria-label="Previous images" disabled>
              <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </button>
            <button class="gallery-slider-control" type="button" data-gallery-next aria-label="Next images">
              <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="gallery-slider-track" data-gallery-track tabindex="0" aria-label="Gallery images" aria-roledescription="carousel">
        <div class="gallery-slide gallery-card image-zoom overflow-hidden rounded-[26px] reveal" role="group" aria-roledescription="slide" aria-label="1 of 6">
          <img
            src="./assets/aruna.png"
            alt="Residence exterior"
            class="gallery-slider-image"
          />
        </div>
        <div class="gallery-slide gallery-card image-zoom overflow-hidden rounded-[26px] reveal delay-1" role="group" aria-roledescription="slide" aria-label="2 of 6">
          <img
            src="./assets/mainhero.png"
            alt="Lifestyle shot"
            class="gallery-slider-image"
          />
        </div>
        <div class="gallery-slide gallery-card image-zoom overflow-hidden rounded-[26px] reveal delay-2" role="group" aria-roledescription="slide" aria-label="3 of 6">
          <img
            src="./assets/Image Container.png"
            alt="Luxury home"
            class="gallery-slider-image"
          />
        </div>
        <div class="gallery-slide gallery-card image-zoom overflow-hidden rounded-[26px] reveal delay-1" role="group" aria-roledescription="slide" aria-label="4 of 6">
          <img src="./assets/nava.png" alt="Modern terrace" class="gallery-slider-image" />
        </div>
        <div class="gallery-slide gallery-card image-zoom overflow-hidden rounded-[26px] reveal delay-2" role="group" aria-roledescription="slide" aria-label="5 of 6">
          <img src="./assets/velora.png" alt="Park view" class="gallery-slider-image" />
        </div>
        <div class="gallery-slide gallery-card image-zoom overflow-hidden rounded-[26px] reveal delay-3" role="group" aria-roledescription="slide" aria-label="6 of 6">
          <img
            src="./assets/seraya.png"
            alt="Family living"
            class="gallery-slider-image"
          />
        </div>
        </div>
      </section>
    </main>
  </body>
</html>
